name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze, format, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android-release-build:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable

      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name negosmint_wallet .

      - name: Configure Android wallet deep link
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("android/app/src/main/AndroidManifest.xml"); s=p.read_text(); marker="        <intent-filter>"; block="        <intent-filter>\\n              <action android:name=\"android.intent.action.VIEW\" />\\n              <category android:name=\"android.intent.category.DEFAULT\" />\\n              <category android:name=\"android.intent.category.BROWSABLE\" />\\n              <data android:scheme=\"negosmintwallet\" android:host=\"connect\" />\\n          </intent-filter>\\n          <intent-filter>\\n              <action android:name=\"android.intent.action.VIEW\" />\\n              <category android:name=\"android.intent.category.DEFAULT\" />\\n              <category android:name=\"android.intent.category.BROWSABLE\" />\\n              <data android:scheme=\"wc\" />\\n          </intent-filter>\\n"; p.write_text(s if "android:scheme=\"negosmintwallet\"" in s else s.replace(marker, block + marker, 1))'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate NegosWallet launcher icon
        run: dart run launcher_icons

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: negosmint-wallet-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
