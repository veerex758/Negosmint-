name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib
      - run: flutter analyze
      - run: flutter test

  android-release-build:
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
      - run: flutter create --platforms=android --project-name negosmint_wallet .
      - name: Configure Android wallet deep link
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()
          marker = '        <intent-filter android:autoVerify="false">'
          block = '''        <intent-filter>
              <action android:name="android.intent.action.VIEW" />
              <category android:name="android.intent.category.DEFAULT" />
              <category android:name="android.intent.category.BROWSABLE" />
              <data android:scheme="negosmintwallet" android:host="connect" />
          </intent-filter>
'''
          if 'android:scheme="negosmintwallet"' not in text:
              text = text.replace('        <intent-filter>', block + '        <intent-filter>', 1)
              path.write_text(text)
          PY
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: negosmint-wallet-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
