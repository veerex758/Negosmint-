name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze, format, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android-release-build:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable

      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name negosmint_wallet .

      - name: Configure Android Maven repositories
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          candidates = [Path("android/settings.gradle.kts"), Path("android/settings.gradle")]
          settings = next((p for p in candidates if p.exists()), None)
          if settings is None:
              raise SystemExit("Android settings.gradle(.kts) not found")

          text = settings.read_text()
          jitpack = 'maven { url = uri("https://jitpack.io") }'

          if "https://jitpack.io" not in text:
              marker = "dependencyResolutionManagement"
              start = text.find(marker)
              if start < 0:
                  raise SystemExit("dependencyResolutionManagement block not found")

              repo = text.find("mavenCentral()", start)
              if repo < 0:
                  raise SystemExit("mavenCentral() inside dependencyResolutionManagement not found")

              insert_at = repo + len("mavenCentral()")
              text = text[:insert_at] + "\n            " + jitpack + text[insert_at:]
              settings.write_text(text)
          PY

      - name: Configure Android wallet deep link
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("android/app/src/main/AndroidManifest.xml"); s=p.read_text(); marker="        <intent-filter>"; block="        <intent-filter>\\n              <action android:name=\"android.intent.action.VIEW\" />\\n              <category android:name=\"android.intent.category.DEFAULT\" />\\n              <category android:name=\"android.intent.category.BROWSABLE\" />\\n              <data android:scheme=\"negosmintwallet\" android:host=\"connect\" />\\n          </intent-filter>\\n          <intent-filter>\\n              <action android:name=\"android.intent.action.VIEW\" />\\n              <category android:name=\"android.intent.category.DEFAULT\" />\\n              <category android:name=\"android.intent.category.BROWSABLE\" />\\n              <data android:scheme=\"wc\" />\\n          </intent-filter>\\n"; p.write_text(s if "android:scheme=\"negosmintwallet\"" in s else s.replace(marker, block + marker, 1))'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate NegosWallet launcher icon
        run: dart run launcher_icons

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: negosmint-wallet-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
