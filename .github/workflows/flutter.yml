name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze, format, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android-release-build:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable

      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name negosmint_wallet .

      - name: Configure Android Maven repositories
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          if not settings.exists():
              settings = Path("android/settings.gradle")
          if not settings.exists():
              raise SystemExit("Android settings.gradle(.kts) not found")

          text = settings.read_text()
          jitpack = 'maven { url = uri("https://jitpack.io") }'

          if "https://jitpack.io" not in text:
              marker = "dependencyResolutionManagement"
              start = text.find(marker)

              if start >= 0:
                  repo = text.find("mavenCentral()", start)
                  if repo < 0:
                      raise SystemExit(
                          "dependencyResolutionManagement exists but mavenCentral() was not found"
                      )

                  insert_at = repo + len("mavenCentral()")
                  text = text[:insert_at] + "\n        " + jitpack + text[insert_at:]
              else:
                  # Flutter 3.47 may generate a settings file without a
                  # dependencyResolutionManagement block. Add one explicitly
                  # so project dependencies can resolve from JitPack.
                  text += """

dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
        maven { url = uri("https://jitpack.io") }
    }
}
"""
              settings.write_text(text)

          if "https://jitpack.io" not in settings.read_text():
              raise SystemExit("JitPack repository was not configured")

          print(f"Configured JitPack in {settings}")
          PY

          grep -n -A12 -B2 'dependencyResolutionManagement' android/settings.gradle*

      - name: Configure Android wallet deep link
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          if "android:scheme=\"negosmintwallet\"" not in text:
              marker = "        <intent-filter>"
              block = """        <intent-filter>
              <action android:name="android.intent.action.VIEW" />
              <category android:name="android.intent.category.DEFAULT" />
              <category android:name="android.intent.category.BROWSABLE" />
              <data android:scheme="negosmintwallet" android:host="connect" />
          </intent-filter>
          <intent-filter>
              <action android:name="android.intent.action.VIEW" />
              <category android:name="android.intent.category.DEFAULT" />
              <category android:name="android.intent.category.BROWSABLE" />
              <data android:scheme="wc" />
          </intent-filter>
"""
              if marker not in text:
                  raise SystemExit("Android manifest activity intent-filter marker not found")
              text = text.replace(marker, block + marker, 1)

          manifest.write_text(text)
          print(f"Configured wallet deep links in {manifest}")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Generate NegosWallet launcher icon
        run: dart run launcher_icons

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: negosmint-wallet-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
